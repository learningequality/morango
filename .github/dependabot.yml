# Keeps dependencies up to date
version: 2
updates:
  # Maintain dependencies for Python
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "00:00"
    cooldown:
      default-days: 7
  # Maintain dependencies for Github Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "00:00"
    groups:
      github:
        patterns:
          - "actions/*"
    cooldown:
      default-days: 7
