# Keeps dependencies up to date

version: 2
updates:
  # Maintain dependencies for Python
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:00"
    cooldown:
      days: 7
  # Maintain dependencies for Github Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:00"
    groups:
      github:
        patterns:
          - "actions/*"
    cooldown:
      days: 7
