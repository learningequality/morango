name: Python tests

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  pre_job:
    name: Path match check
    runs-on: ubuntu-latest
    # Map a step output to a job output
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@master
        with:
          github_token: ${{ github.token }}
          paths: '["**.py", ".github/workflows/tox.yml", "tox.ini", "pyproject.toml", "uv.lock"]'

  build:
    name: Build wheel
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: 3.9
          enable-cache: "true"
      - name: Build wheel
        run: uv build --wheel
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wheel
          path: dist/*.whl
          retention-days: 1

  unit_test:
    name: Python unit tests
    needs: [pre_job, build]
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5
      matrix:
        python-version: [3.9, '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Download wheel artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: wheel
          path: dist/
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "${{ matrix.python-version }}"
          activate-environment: "true"
          enable-cache: "true"
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Test with tox
        run: uv run tox --installpkg "$(find dist/ -name '*.whl')" -e py${{ matrix.python-version }}

  unit_test_eol_python:
    name: Python unit tests for EOL Python versions
    needs: [pre_job, build]
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5
      matrix:
        python-version: [3.6, 3.7, 3.8]
    container:
      image: python:${{ matrix.python-version }}-buster
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Download wheel artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: wheel
          path: dist/
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: "true"
      - name: Manually install test dependencies
        run: |
          uv pip install --system --group test
      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          pip install tox
      - name: tox env cache
        uses: actions/cache@v5.0.5
        with:
          path: ${{ github.workspace }}/.tox/py${{ matrix.python-version }}
          key: ${{ runner.os }}-tox-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
      - name: Test with tox
        run: tox --installpkg "$(find dist/ -name '*.whl')" -e py${{ matrix.python-version }} --sitepackages

  cryptography:
    name: Python unit tests + cryptography
    needs: [pre_job, build]
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    env:
      cryptography_version: '40.0.2'
    strategy:
      max-parallel: 5
      matrix:
        python-version: [3.9, '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Download wheel artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: wheel
          path: dist/
      - name: Install system dependencies
        run: |
          sudo apt-get -y -qq update
          sudo apt-get install -y openssl libssl-dev
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "${{ matrix.python-version }}"
          enable-cache: "true"
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Test with tox
        run: uv run tox --installpkg "$(find dist/ -name '*.whl')" -e py${{ matrix.python-version }}-cryptography${{ env.cryptography_version }}

  cryptography_eol_python:
    name: Python unit tests + cryptography for EOL Python versions
    needs: [pre_job, build]
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    env:
      cryptography_version: '40.0.2'
    strategy:
      max-parallel: 5
      matrix:
        python-version: [3.6, 3.7, 3.8]
    container:
      image: python:${{ matrix.python-version }}-buster
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Download wheel artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: wheel
          path: dist/
      - name: Install system dependencies
        run: |
          echo "deb http://archive.debian.org/debian-archive/debian/ buster main" > /etc/apt/sources.list
          echo "deb http://archive.debian.org/debian-archive/debian-security/ buster/updates main" >> /etc/apt/sources.list
          echo "Acquire::Check-Valid-Until \"false\";" > /etc/apt/apt.conf.d/99archive
          apt-get -y -qq update
          apt-get install -y openssl libssl-dev
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: "true"
      - name: Manually install test dependencies
        run: |
          uv pip install --system --group test
      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          pip install tox
      - name: tox env cache
        uses: actions/cache@v5.0.5
        with:
          path: ${{ github.workspace }}/.tox/py${{ matrix.python-version }}-cryptography${{ env.cryptography_version }}
          key: ${{ runner.os }}-tox-py${{ matrix.python-version }}-crypto${{ env.cryptography_version }}-${{ hashFiles('pyproject.toml') }}
      - name: Test with tox
        run: tox --installpkg "$(find dist/ -name '*.whl')" -e py${{ matrix.python-version }}-cryptography${{ env.cryptography_version }} --sitepackages

  postgres:
    name: Python postgres unit tests
    needs: [pre_job, build]
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: postgres
        # Provide the password for postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Download wheel artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: wheel
          path: dist/
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.9"
          activate-environment: "true"
          enable-cache: "true"
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Test with tox
        run: uv run tox --installpkg "$(find dist/ -name '*.whl')" --discover "$(uv python find 3.9)" -e postgres

  windows:
    name: Python unit tests on Windows Server
    needs: [pre_job, build]
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: windows-latest
    strategy:
      max-parallel: 5
      matrix:
        python-version: [3.8]
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Download wheel artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: wheel
          path: dist/
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: "true"
      - name: Manually install test dependencies
        run: |
          uv pip install --system --group test
      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          pip install tox
      - name: Test with tox
        run: |
          $wheel = Get-ChildItem dist\*.whl | Select-Object -ExpandProperty FullName -First 1
          tox --installpkg $wheel -e windows --sitepackages

  # Single stable check for branch protection. Skipped matrix jobs don't
  # produce per-version check runs, so matrix-suffixed required checks hang
  # as "Expected" on PRs that skip the tests; require this job instead.
  required_checks:
    name: Python tests
    needs:
      - pre_job
      - build
      - unit_test
      - unit_test_eol_python
      - cryptography
      - cryptography_eol_python
      - postgres
      - windows
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any needed job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
