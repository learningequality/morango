name: Linting

on:
  push:
    branches:
      - 'release-v**'
  pull_request:
    branches:
      - 'release-v**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  pre_job:
    name: Path match check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    # Map a step output to a job output
    outputs:
      lint: ${{ steps.filter.outputs.lint }}
    steps:
      # paths-filter needs a checkout to diff push events
      - uses: actions/checkout@v6.0.3
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          # Not '!**.po': picomatch applies that negation at the repo root only.
          filters: |
            lint:
              - '!**/*.po'
              - '!**/*.json'

  linting:
    name: All file linting
    needs: pre_job
    if: ${{ needs.pre_job.outputs.lint == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-python: true
      - name: Install and verify lock
        run: uv sync --group dev --locked
      - name: Run prek hooks
        run: uv run prek run --all-files --show-diff-on-failure
